<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>
        - Подсчёт чётных и нечётных
    Условие:** Напиши `countEvenOdd(nums)`, которая вернёт объект `{ even, odd }` с количеством чётных и нечётных чисел.
    // Вход:
    const nums = [1, 2, 3, 4, 5, 6];
    </p>
    <div class="answer"></div>
    <script>
        // Вход:
const nums = [1, 2, 3, 4, 5, 6];

function countEvenOdd (arr) {
    let obj = {
        even: 0,
        odd: 0,
    };
    for(let i of arr) {
        if(i%2 === 0) obj.even +=1
        else obj.odd +=1
    }
    return obj;
};
// Вызов:
const result = countEvenOdd(nums);
console.log(result);
document.querySelector('.answer').innerHTML = `Ответ: четных - ${result.even}, нечетных - ${result.odd}`
// Ожидаемый результат:
// const expected = { even: 3, odd: 3 };
    </script>
</body>
</html>

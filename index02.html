<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>
        - Поиск минимума и максимума

        Условие: Напиши `minMax(nums)`, которая вернёт объект `{ min, max }`. Если массив пуст — верни `{ min: null, max: null }`.

    </p>
    <pre>
// Вход:
const nums = [10, -3, 7, 0];

// Вызов:
const result = minMax(nums);

// Ожидаемый результат:
const expected = { min: -3, max: 10 };
    </pre>
    <div class="answer"></div>
    <script>
        // Вход:
        const nums = [10, -3, 7, 0
        ];
        
        function minMax(arr) {
            let obj = {
                min: null,
                max: null,
            };
            for(let i of arr) {
                console.log(i)
                if(i<obj.min) obj.min = i
                if(i>obj.max) obj.max = i
            }
            return obj;
        }

        // Вызов:
        const result = minMax(nums);
        console.log(result)
        document.querySelector('.answer').innerHTML = `Ответ <br> min ${result.min} , max ${result.max}`
        // Ожидаемый результат:
        // const expected = { min: -3, max: 10 };
    </script>
</body>
</html>

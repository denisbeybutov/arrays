<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Proto 01</p>
    <script>
        String.prototype.removeVowels = function(){            
            return JSON.stringify(this).replace(/[aeiou]/gi,'');                        
        }
        console.log("hello".removeVowels())// -> "hll"
        console.log("JavaScript".removeVowels())// -> "JvScrpt"       
    </script>
</body>
</html>
